<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>INFO310 - BPMN Teaching Prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <h3 style="text-align:center;">INFO310 - BPMN Teaching Prototype</h3>

  <!-- === Start Screen - ID creator === -->
  <!-- Creates unique ID used for learning analytics -->
  <div id="loginSection" style="text-align:center; margin-bottom:20px;">
    <p><b>Enter your player ID:</b></p>

    <input type="text" id="initials" placeholder="Initials (e.g., TS)" style="width:120px; text-transform:uppercase;" oninput="if(this.value.length > 3) this.value = this.value.slice(0,3)">
    <input type="number" id="birthDay" placeholder="Day (e.g., 26)" style="width:100px;" oninput="if(this.value.length > 2) this.value = this.value.slice(0,2)">
    <input type="number" id="birthMonth" placeholder="Month (e.g., 07)" style="width:100px;" oninput="if(this.value.length > 2) this.value = this.value.slice(0,2)">

    <br><br>
    <button onclick="startGame()">Start Game</button>
  </div>

  <!-- === GAME AREA (hidden until game starts) === -->
  <!-- updated using view.js - updateGameArea -->
  <div id="app" style="display:none; text-align:center;">
  </div>

  <!-- === End Screen (hidden until scenario ends) === -->
  <!-- updated using view.js - updateEndScreen -->
  <div id="end" style="display:none; text-align:center;">
  </div>

  <!-- === JS imports === -->
  <script src="js/model.js"></script>
  <script src="js/view.js"></script>
  <script src="js/userInput.js"></script>
  <script src="js/drawFunctions.js"></script>
  <script src="js/dataLoader.js"></script>
  <script src="js/learningSystem.js"></script>
  <script src="js/verifier.js"></script>
  <script src="js/controller.js"></script>
</body>
</html>
