<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>INFO310 - BPMN Teaching Prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <h3 style="text-align:center;">INFO310 - BPMN Teaching Prototype</h3>

  
  <!--          LOGIN            -->
 
  <div id="loginSection" style="text-align:center; margin-bottom:20px;">
    <p><b>Enter your player ID:</b></p>

    <input type="text" id="initials" maxlength="3" placeholder="Initials (e.g., TS)"
           style="width:120px; text-transform:uppercase;">
    <input type="number" id="birthDay" min="1" max="31" placeholder="Day (e.g., 26)"
           style="width:100px;">
    <input type="number" id="birthMonth" min="1" max="12" placeholder="Month (e.g., 07)"
           style="width:100px;">

    <br><br>
    <button onclick="startGame()">Start Game</button>
  </div>

  
  <!--      MAIN GAME AREA       -->
  
  <div id="app" style="display:none; text-align:center;">
    <!-- Filled dynamically by view.js -->
  </div>


  
  <!--       SCRIPT ORDER        -->
  
  <!-- MODEL must load first -->
  <script src="js/model.js"></script>

  <!-- UI generator -->
  <script src="js/view.js"></script>

  <!-- Drawing functions (nodes, pools, lanes, arrows) -->
  <script src="js/drawFunctions.js"></script>

  <!-- Scenario loader -->
  <script src="js/dataLoader.js"></script>

  <!-- Verifier MUST load before learning + controller -->
  <script src="js/verifier.js"></script>

  <!-- Learning (pre/post quiz, BKT, Google Sheets) -->
  <script src="js/learningSystem.js"></script>

  <!-- Controller (mouse, canvas, scenario switching) -->
  <script src="js/controller.js"></script>

</body>
</html>
